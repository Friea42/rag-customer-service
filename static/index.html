<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG 客服 Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-shadow: 0 0 24px rgba(0,0,0,.06);
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid #eef0f2;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
  header h1 { font-size: 17px; font-weight: 600; color: #1f2329; }
  header span { font-size: 12px; color: #8a9099; margin-left: auto; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 86%; }
  .msg .avatar {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .msg.bot .avatar { background: #eaf1ff; color: #2f6bff; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .avatar { background: #2f6bff; color: #fff; }
  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.bot .bubble { background: #f2f4f7; color: #1f2329; border-top-left-radius: 2px; }
  .msg.user .bubble { background: #2f6bff; color: #fff; border-top-right-radius: 2px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 24px 8px; }
  .chip {
    font-size: 12px;
    color: #2f6bff;
    background: #eef3ff;
    border: none;
    border-radius: 14px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .chip:hover { background: #dbe6ff; }
  .input-bar {
    display: flex;
    gap: 10px;
    padding: 16px 24px 22px;
    border-top: 1px solid #eef0f2;
  }
  #input {
    flex: 1;
    border: 1px solid #dee0e3;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 120px;
  }
  #input:focus { border-color: #2f6bff; }
  #send {
    background: #2f6bff;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:disabled { background: #a8bffc; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="dot"></div>
      <h1>智能客服助手</h1>
      <span>支持订单物流 · 退货退款 · 知识库问答</span>
    </header>
    <div id="chat"></div>
    <div class="chips">
      <button class="chip">我的快递到哪了？订单 A1001</button>
      <button class="chip">我要退货</button>
      <button class="chip">七天无理由退货规则是什么？</button>
    </div>
    <div class="input-bar">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </div>
  </div>

<script>
  const chatBox = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let threadId = localStorage.getItem('cs_thread_id') || null;

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.innerHTML =
      '<div class="avatar">' + (role === 'bot' ? '客' : '我') + '</div>' +
      '<div class="bubble"></div>';
    wrap.querySelector('.bubble').textContent = text;
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function send(text) {
    text = (text ?? input.value).trim();
    if (!text) return;
    addMessage('user', text);
    input.value = '';
    sendBtn.disabled = true;
    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, thread_id: threadId })
      });
      const data = await resp.json();
      threadId = data.thread_id;
      localStorage.setItem('cs_thread_id', threadId);
      addMessage('bot', data.reply);
    } catch (e) {
      addMessage('bot', '网络异常，请确认服务已启动（python main.py）。');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', () => send());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  document.querySelectorAll('.chip').forEach((btn) =>
    btn.addEventListener('click', () => send(btn.textContent))
  );

  addMessage('bot', '您好，我是智能客服助手～可以查询物流、办理退货退款，也可以咨询售后政策，请问有什么可以帮您？');
  input.focus();
</script>
</body>
</html>
